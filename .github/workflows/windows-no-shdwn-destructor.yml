name: Windows no SHDWN destructor diagnostic

on:
  push:
    branches: [wd/windows-historical-cyapi-lifecycle]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Suppress RadioHardware destructor SHDWN only
        shell: python
        run: |
          from pathlib import Path
          p=Path('Core/radio/RadioHardware.cpp')
          s=p.read_text()
          old='''RadioHardware::~RadioHardware()\n{\n    TracePrintln(TAG, "");\n    if (Fx3) {\n        SetGPIO(SHDWN);\n    }\n}'''
          new='''RadioHardware::~RadioHardware()\n{\n    TracePrintln(TAG, "");\n    if (Fx3) {\n        WarnPrintln(TAG, "DIAGNOSTIC: suppressing destructor SetGPIO(SHDWN)");\n    }\n}'''
          if old not in s: raise SystemExit('RadioHardware destructor marker not found')
          p.write_text(s.replace(old,new,1))
      - name: Show diff
        shell: bash
        run: git diff -- Core/radio/RadioHardware.cpp
      - name: Install dependencies
        run: cd c:\vcpkg ; git pull ; vcpkg install soapysdr:x64-windows
      - run: cmake -E make_directory ${{runner.workspace}}/build64-noshdwn
      - name: Configure
        shell: bash
        working-directory: ${{runner.workspace}}/build64-noshdwn
        run: cmake $GITHUB_WORKSPACE "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=$BUILD_TYPE -A x64
      - name: Build
        shell: bash
        working-directory: ${{runner.workspace}}/build64-noshdwn
        run: cmake --build . --config $BUILD_TYPE --target SDDCSupport
      - name: SHA256
        shell: pwsh
        run: Get-FileHash "${{runner.workspace}}/build64-noshdwn/SoapySDDC/Release/SDDCSupport.dll" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: SDDCSupport-Windows-x64-no-shdwn-destructor
          path: ${{runner.workspace}}/build64-noshdwn/SoapySDDC/Release/SDDCSupport.dll
